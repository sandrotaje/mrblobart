h a giant eye, representing human imagination." loading="lazy"> </div> </a><a href="/walls/freestyle-167b-street-lecce" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/freestyle-167b-street-lecce.avif" srcset="/images/walls/freestyle-167b-street-lecce-640.avif 640w, /images/walls/freestyle-167b-street-lecce-1280.avif 1280w, /images/walls/freestyle-167b-street-lecce.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Freestyle biomorphic graffiti mural by Mr Blob Art for 167/B Street, integrating a complex wildstyle lettering spelling BLOB into a surreal organic creature on a curved street wall." loading="lazy"> </div> </a><a href="/walls/forever-nash" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/forever-nash.avif" srcset="/images/walls/forever-nash-640.avif 640w, /images/walls/forever-nash-1280.avif 1280w, /images/walls/forever-nash.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Powerful graffiti tribute mural to writer Nash by Mr Blob at Overline Jam, featuring a character holding a stylized spray can and neon green smoke spelling NASH under a Rest in King tag." loading="lazy"> </div> </a><a href="/walls/wine-tower" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/wine-tower.avif" srcset="/images/walls/wine-tower-640.avif 640w, /images/walls/wine-tower-1280.avif 1280w, /images/walls/wine-tower.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Stunning vertical graffiti mural for an Italian winery by Mr Blob, featuring a surreal anthropomorphic grapevine plant character with purple leaves and grapes against a vibrant pink sky." loading="lazy"> </div> </a><a href="/walls/desperate-world" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/desperate-world.avif" srcset="/images/walls/desperate-world-640.avif 640w, /images/walls/desperate-world-1280.avif 1280w, /images/walls/desperate-world.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Stunning 3D optical illusion graffiti mural by Mr Blob featuring an abstract surreal character sliced into rings floating in glowing green water with transparent insect wings, painted on a black background." loading="lazy"> </div> </a><a href="/walls/50th-hip-hop" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/50th-hip-hop.avif" srcset="/images/walls/50th-hip-hop-640.avif 640w, /images/walls/50th-hip-hop-1280.avif 1280w, /images/walls/50th-hip-hop.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Epic cyberpunk DJ graffiti mural by Italian artist Mr Blob at The Bushwick Collective in Brooklyn, New York, featuring a futuristic character with neon headphones scratching a giant vinyl record." loading="lazy"> </div> </a><a href="/walls/collaboration-with-mate-chieri" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/collaboration-with-mate-chieri.avif" srcset="/images/walls/collaboration-with-mate-chieri-640.avif 640w, /images/walls/collaboration-with-mate-chieri-1280.avif 1280w, /images/walls/collaboration-with-mate-chieri.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Massive vertical building facade graffiti mural by Mr Blob and Mate for Sketchmate, featuring a realistic female portrait blending with pink clouds and a surreal Cheshire cat interwoven into giant 3D lettering." loading="lazy"> </div> </a><a href="/walls/inverted-blobworld" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/inverted-blobworld.avif" srcset="/images/walls/inverted-blobworld-640.avif 640w, /images/walls/inverted-blobworld-1280.avif 1280w, /images/walls/inverted-blobworld.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Hyperrealistic close-up portrait graffiti mural by Mr Blob, splitting a male face into a green wood-textured side and a purple side with organic orange root patterns." loading="lazy"> </div> </a><a href="/walls/blobworld" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/blobworld.avif" srcset="/images/walls/blobworld-640.avif 640w, /images/walls/blobworld-1280.avif 1280w, /images/walls/blobworld.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Biomorphic sci-fi graffiti mural by Italian artist Mr Blob at The Bushwick Collective in Brooklyn, New York, featuring a surreal giant eye mechanical character merging into green leaves and roots." loading="lazy"> </div> </a><a href="/walls/more-fire" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/more-fire.avif" srcset="/images/walls/more-fire-640.avif 640w, /images/walls/more-fire-1280.avif 1280w, /images/walls/more-fire.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Vibrant red surreal street art mural painted by Mr Blob on the side of a residential house in the UK, featuring a detailed cartoon character with pop art elements on Garnet St." loading="lazy"> </div> </a><a href="/walls/wynwood-mural-fest-2021" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/wynwood-mural-fest-2021.avif" srcset="/images/walls/wynwood-mural-fest-2021-640.avif 640w, /images/walls/wynwood-mural-fest-2021-1280.avif 1280w, /images/walls/wynwood-mural-fest-2021.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Stunning collaborative graffiti mural by Mr Blob and Giulio Rosk at Wynwood Mural Fest in Miami, featuring a realistic male portrait underwater and a surreal neon cat character." loading="lazy"> </div> </a><a href="/walls/wynwood-private-wall-2021" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/wynwood-private-wall-2021.avif" srcset="/images/walls/wynwood-private-wall-2021-640.avif 640w, /images/walls/wynwood-private-wall-2021-1280.avif 1280w, /images/walls/wynwood-private-wall-2021.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Stunning street art mural in Wynwood, Miami by Mr Blob and Giulio Rosk, featuring two hyperrealistic portraits facing a central surreal biomechanical character connected by glowing lines." loading="lazy"> </div> </a><a href="/walls/tree-of-life" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/tree-of-life.avif" srcset="/images/walls/tree-of-life-640.avif 640w, /images/walls/tree-of-life-1280.avif 1280w, /images/walls/tree-of-life.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Stunning circular street art mural by Mr Blob on a building facade, featuring a complex surreal ecosystem with illustrative bird-like characters, a cage, a waterfall, and a book of freedom against a sunset." loading="lazy"> </div> </a><a href="/walls/esho-funi" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/esho-funi.avif" srcset="/images/walls/esho-funi-640.avif 640w, /images/walls/esho-funi-1280.avif 1280w, /images/walls/esho-funi.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Massive vertical graffiti mural by Mr Blob featuring a surreal forest fantasy creature with a mushroom hat and fairy wings interwoven with giant orange and yellow wildstyle lettering on a building facade." loading="lazy"> </div> </a><a href="/walls/save-the-planet" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/save-the-planet.avif" srcset="/images/walls/save-the-planet-640.avif 640w, /images/walls/save-the-planet-1280.avif 1280w, /images/walls/save-the-planet.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Powerful environmental street art mural by Mr Blob titled Save the Planet, featuring a giant surreal marine creature, a sea turtle, and a polar bear trapped on a melting globe split in half." loading="lazy"> </div> </a><a href="/walls/festivart-lavagna-2020" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/festivart-lavagna-2020.avif" srcset="/images/walls/festivart-lavagna-2020-640.avif 640w, /images/walls/festivart-lavagna-2020-1280.avif 1280w, /images/walls/festivart-lavagna-2020.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Stunning neon graffiti mural by Mr Blob on a black background, featuring a surreal bird character with glowing cyan wings, a skeletal neon structure, and vibrant light-emission spray effects." loading="lazy"> </div> </a><a href="/walls/ilva-is-a-killer" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/ilva-is-a-killer.avif" srcset="/images/walls/ilva-is-a-killer-640.avif 640w, /images/walls/ilva-is-a-killer-1280.avif 1280w, /images/walls/ilva-is-a-killer.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Powerful political activism street art mural by Mr Blob in Milan on Via Dionigi Bussola, protesting against ILVA pollution with a surreal fish character, an hourglass, and industrial chimneys on puzzle pieces." loading="lazy"> </div> </a><a href="/walls/stop-plastic" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/stop-plastic.avif" srcset="/images/walls/stop-plastic-640.avif 640w, /images/walls/stop-plastic-1280.avif 1280w, /images/walls/stop-plastic.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Stunning vertical bio-organic street art mural by Mr Blob, showcasing a surreal deep-sea fish with glowing neon pink jellyfish and an orange crustacean inside a floating dark oval shape." loading="lazy"> </div> </a><a href="/walls/gargoyle" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/gargoyle.avif" srcset="/images/walls/gargoyle-640.avif 640w, /images/walls/gargoyle-1280.avif 1280w, /images/walls/gargoyle.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Stunning vertical street art mural by Mr Blob in France, featuring a majestic surreal phoenix character with glowing magma cracks, metallic wings, and vibrant neon light-emission effects on a black facade." loading="lazy"> </div> </a><a href="/walls/bushwick-collective-2019" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/bushwick-collective-2019.avif" srcset="/images/walls/bushwick-collective-2019-640.avif 640w, /images/walls/bushwick-collective-2019-1280.avif 1280w, /images/walls/bushwick-collective-2019.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Vibrant horizontal street art mural by Italian artist Mr Blob at The Bushwick Collective in Brooklyn, New York, featuring an orange surreal dragon character stretching across a dark brick factory wall." loading="lazy"> </div> </a><a href="/walls/woodland-prince" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/woodland-prince.avif" srcset="/images/walls/woodland-prince-640.avif 640w, /images/walls/woodland-prince-1280.avif 1280w, /images/walls/woodland-prince.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Stunning pop surrealism graffiti mural by Mr Blob integrating an architectural circular window into a wooden birdhouse, featuring a psychedelic cheshire cat character against a misty forest background." loading="lazy"> </div> </a><a href="/walls/firpowall-torino-2018" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/firpowall-torino-2018.avif" srcset="/images/walls/firpowall-torino-2018-640.avif 640w, /images/walls/firpowall-torino-2018-1280.avif 1280w, /images/walls/firpowall-torino-2018.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Stunning dark fantasy cartoon graffiti mural by Mr Blob, featuring a surreal winged creature riding a rocking horse next to a blue horse head and a glowing neon skull cauldron in a desert." loading="lazy"> </div> </a><a href="/walls/good" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/good.avif" srcset="/images/walls/good-640.avif 640w, /images/walls/good-1280.avif 1280w, /images/walls/good.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Stunning collaborative graffiti mural by Mr Blob, Moe, and Korvo, featuring a shiny golden Buddha character sitting inside a floating manta ray next to a surreal colorful bird and wildstyle lettering." loading="lazy"> </div> </a><a href="/walls/collaboration-with-davide-dpa" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/collaboration-with-davide-dpa.avif" srcset="/images/walls/collaboration-with-davide-dpa-640.avif 640w, /images/walls/collaboration-with-davide-dpa-1280.avif 1280w, /images/walls/collaboration-with-davide-dpa.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Stunning 3D geometric graffiti mural by Mr Blob, featuring a surreal snail character with floating eyes and a glowing moon insect against an optical illusion pattern and isometric cubes." loading="lazy"> </div> </a><a href="/walls/blove" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/blove.avif" srcset="/images/walls/blove-640.avif 640w, /images/walls/blove-1280.avif 1280w, /images/walls/blove.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Stunning oriental pop surrealism graffiti mural by Mr Blob, featuring a surreal wild boar character in a floating temple holding a staff next to a smiling anthropomorphic strawberry against a fiery pagoda sunset." loading="lazy"> </div> </a><a href="/walls/tribute-to-5pointz" class="artwork-item"> <div class="artwork-image-container"> <img src="/images/walls/tribute-to-5pointz.avif" srcset="/images/walls/tribute-to-5pointz-640.avif 640w, /images/walls/tribute-to-5pointz-1280.avif 1280w, /images/walls/tribute-to-5pointz.avif 2560w" sizes="(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw" alt="Stunning 3D tribute graffiti mural to New York 5Pointz by Mr Blob, featuring the iconic building turned into a boombox truck, breakdancers, corporate businessmen, and a 5 Lives On flag on a torn paper background." loading="lazy"> </div> </a> </div> </div> </div>  </main> <footer class="footer"> <div class="container"> <div class="social-icons"> <a href="https://instagram.com/mrblobart" target="_blank" rel="noopener noreferrer" aria-label="Instagram"> <img src="https://simpleicons.org/icons/instagram.svg" alt="Instagram" class="social-icon"> </a> <a href="https://www.facebook.com/mrblobart" target="_blank" rel="noopener noreferrer" aria-label="Facebook"> <img src="https://simpleicons.org/icons/facebook.svg" alt="Facebook" class="social-icon"> </a> <a href="https://www.youtube.com/@mrblobart" target="_blank" rel="noopener noreferrer" aria-label="YouTube"> <img src="https://simpleicons.org/icons/youtube.svg" alt="YouTube" class="social-icon"> </a> </div> <div class="copyright">
